services:

  db-mysql:
    image: mysql:8.4.0
    volumes:
      - db_mysql_persistence:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    container_name: mysql-container
    ports:
      - "${DATABASE_PORT}:3306"

  my-spring-app:
    build: .
    container_name: my-spring-app
    ports:
      - "80:8080"
    depends_on:
      - db-mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/${DATABASE_NAME}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
      - SPRING_DATASOURCE_DRIVER=${DATABASE_DRIVER}

volumes:
  db_mysql_persistence:

